<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-primary);
            overflow: hidden;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            z-index: 10;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-section i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
            text-shadow: 0 0 20px var(--primary-light);
        }
        .logo-section h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-primary);
        }
        .logo-section p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0.25rem 0 0 0;
        }
        .input-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .input-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            transition: var(--transition);
        }
        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .actions-row {
            display: flex;
            gap: 1rem;
            margin-top: 1.75rem;
        }
        .actions-row .btn {
            flex: 1;
            justify-content: center;
        }
        .text-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            font-size: 0.8rem;
        }
        .text-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- Configuration and Auth -->
    <script src="firebase-init.js"></script>
    <script src="auth.js"></script>

    <div class="login-card glass-panel">
        <div class="logo-section">
            <i class="fas fa-user-shield"></i>
            <h1 id="panel-title">Secure Portal</h1>
            <p id="panel-subtitle">Login to sync attendance database</p>
        </div>

        <section id="auth-section">
            <form id="auth-form">
                <div class="input-group">
                    <label for="auth-username">Username / Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="auth-username" required placeholder="e.g. administrator">
                    </div>
                </div>
                <div class="input-group">
                    <label for="auth-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="auth-password" required placeholder="••••••••">
                    </div>
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-primary); font-size: 0.9rem;">
                            <input type="radio" name="auth-role" value="student" checked> Student
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-primary); font-size: 0.9rem;">
                            <input type="radio" name="auth-role" value="faculty"> Faculty
                        </label>
                    </div>
                </div>
                <div class="actions-row">
                    <button type="button" id="btn-signup" class="btn btn-outline">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                    <button type="submit" id="btn-login" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </div>
            </form>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authForm = document.getElementById('auth-form');
            const usernameInput = document.getElementById('auth-username');
            const passwordInput = document.getElementById('auth-password');
            const btnSignup = document.getElementById('btn-signup');

            // Sign Up Handler
            btnSignup.addEventListener('click', async () => {
                const username = usernameInput.value.trim().toLowerCase();
                const password = passwordInput.value;
                const roleInput = document.querySelector('input[name="auth-role"]:checked');
                const role = roleInput ? roleInput.value : 'student';

                if (!username || password.length < 6) {
                    alert("Username/Email is required, and password must be at least 6 characters long.");
                    return;
                }

                try {
                    await authManager.register(username, password, role);
                    alert("Account registered successfully! Logging you in...");
                    window.location.href = 'index.html';
                } catch (e) {
                    alert(`Registration failed: ${e.message}`);
                }
            });

            // Login Handler
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = usernameInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                try {
                    await authManager.login(username, password);
                    window.location.href = 'index.html';
                } catch (e) {
                    alert(`Login failed: ${e.message}`);
                }
            });
        });
    </script>
</body>
</html>
