<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal - Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-primary);
            overflow: hidden;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            z-index: 10;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-section i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
            text-shadow: 0 0 20px var(--primary-light);
        }
        .logo-section h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-primary);
        }
        .logo-section p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0.25rem 0 0 0;
        }
        .input-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .input-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            transition: var(--transition);
        }
        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .actions-row {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.75rem;
        }
        .actions-row .btn {
            width: 100%;
            justify-content: center;
        }
        .text-links {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .text-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- Configuration and Auth -->
    <script src="firebase-init.js"></script>
    <script src="auth.js"></script>

    <div class="login-card glass-panel">
        <div class="logo-section">
            <i class="fas fa-user-plus"></i>
            <h1 id="panel-title">Register Account</h1>
            <p id="panel-subtitle">Create a new attendance account</p>
        </div>

        <section id="auth-section">
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-name" required placeholder="e.g. John Doe">
                    </div>
                </div>
                <div class="input-group">
                    <label for="reg-username">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-username" required placeholder="e.g. john@mrcet.edu">
                    </div>
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-password" required placeholder="••••••••">
                    </div>
                </div>
                <div class="input-group" id="year-group">
                    <label for="reg-year">Year</label>
                    <div class="input-wrapper">
                        <i class="fas fa-calendar-alt"></i>
                        <select id="reg-year" style="width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border-radius: var(--radius-md); border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; outline: none; box-sizing: border-box; cursor: pointer; transition: var(--transition); appearance: none;">
                            <option value="" disabled selected>Select Year</option>
                            <option value="II">2nd Year (II)</option>
                            <option value="III">3rd Year (III)</option>
                            <option value="IV">4th Year (IV)</option>
                        </select>
                    </div>
                </div>
                <div class="input-group" id="section-group">
                    <label for="reg-section">Section</label>
                    <div class="input-wrapper">
                        <i class="fas fa-users"></i>
                        <select id="reg-section" style="width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border-radius: var(--radius-md); border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; outline: none; box-sizing: border-box; cursor: pointer; transition: var(--transition); appearance: none;">
                            <option value="" disabled selected>Select Section</option>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-primary); font-size: 0.9rem;">
                            <input type="radio" name="reg-role" value="student" checked> Student
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-primary); font-size: 0.9rem;">
                            <input type="radio" name="reg-role" value="faculty"> Faculty
                        </label>
                    </div>
                </div>
                <div class="actions-row">
                    <button type="submit" id="btn-signup" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                </div>
                
                <div class="text-links">
                    <a href="login.html">Already have an account? Login</a>
                </div>
            </form>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('register-form');
            const nameInput = document.getElementById('reg-name');
            const usernameInput = document.getElementById('reg-username');
            const passwordInput = document.getElementById('reg-password');
            const yearInput = document.getElementById('reg-year');
            const sectionInput = document.getElementById('reg-section');

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = nameInput.value.trim();
                const username = usernameInput.value.trim().toLowerCase();
                const password = passwordInput.value;
                const roleInput = document.querySelector('input[name="reg-role"]:checked');
                const role = roleInput ? roleInput.value : 'student';
                const year = yearInput.value.trim();
                const section = sectionInput.value.trim();

                if (!name || !username || password.length < 6) {
                    alert("Name and Email are required, and password must be at least 6 characters long.");
                    return;
                }
                
                if (username !== 'admin@mrcet.edu' && role === 'student' && (!year || !section)) {
                    alert("Year and Section are required for student registration.");
                    return;
                }

                try {
                    await authManager.register(name, username, password, role, year, section);
                    if (username === 'admin@mrcet.edu') {
                        alert("Admin account registered successfully! Logging you in...");
                        window.location.href = 'admin.html';
                    } else {
                        alert("Account registered successfully! Please wait for Admin approval before you can access the dashboard.");
                        window.location.href = 'login.html';
                    }
                } catch (e) {
                    alert(`Registration failed: ${e.message}`);
                }
            });

            // Handle role change to show/hide year and section
            const roleRadios = document.querySelectorAll('input[name="reg-role"]');
            const yearGroup = document.getElementById('year-group');
            const sectionGroup = document.getElementById('section-group');
            
            roleRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'faculty') {
                        yearGroup.style.display = 'none';
                        sectionGroup.style.display = 'none';
                    } else {
                        yearGroup.style.display = 'block';
                        sectionGroup.style.display = 'block';
                    }
                });
            });

        });
    </script>
</body>
</html>
