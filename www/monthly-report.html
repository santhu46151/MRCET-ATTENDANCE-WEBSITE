<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance Report - Section IV-D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS library to export genuine Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>

    <!-- App Configuration and Auth -->
    <script src="auth.js"></script>
    <style>
        /* Specific Styles for Excel Monthly Report */
        .report-wrapper {
            background-color: white;
            color: #000;
            padding: 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid #ccc;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }

        .dark-mode .report-wrapper {
            background-color: #ffffff; /* Keep report white like paper even in dark mode for printable layout */
            color: #000000;
            border-color: #bbbbbb;
        }

        /* College Header Styling */
        .college-header {
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            align-items: center;
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .college-logo-svg {
            width: 90px;
            height: 90px;
        }

        .college-info h2 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: #4b0082; /* Indigo/Purple color */
            margin-bottom: 0.15rem;
        }

        .college-info h3 {
            font-size: 0.95rem;
            color: red;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .college-info p {
            font-size: 0.8rem;
            color: #333;
            font-weight: 600;
            line-height: 1.3;
        }

        .report-subtitle {
            text-align: center;
            font-weight: 800;
            border-bottom: 1.5px solid #000;
            padding: 0.35rem 0;
            font-size: 0.95rem;
        }

        .section-badge {
            text-align: center;
            font-weight: 800;
            font-size: 0.9rem;
            background-color: #e2e8f0;
            padding: 0.3rem;
            border: 1px solid #000;
            margin: 0.5rem 0 1rem 0;
        }

        /* Excel grid table formatting */
        .excel-grid-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
        }

        .excel-grid-table th, 
        .excel-grid-table td {
            border: 1px solid #000;
            padding: 4px 6px;
            vertical-align: middle;
        }

        .excel-grid-table th {
            background-color: #f2f2f2;
            font-weight: 700;
            text-align: center;
        }

        .excel-grid-table td {
            text-align: center;
            font-weight: 500;
        }

        .excel-grid-table td.student-name-cell {
            text-align: left;
            padding-left: 8px;
            font-weight: 600;
            white-space: nowrap;
        }

        .excel-grid-table td.absent-cell {
            color: red;
            font-weight: 700;
            background-color: #fee2e2;
        }

        .excel-grid-table tr.totals-row td {
            font-weight: 700;
            background-color: #f2f2f2;
        }

        .excel-grid-table tr:hover {
            background-color: rgba(79, 70, 229, 0.05);
        }

        /* Controls Panel */
        .controls-panel {
            max-width: 1250px;
            margin: 0 auto 1.5rem auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 0.5cm;
            }
            body {
                background: white !important;
                color: black !important;
                padding: 0;
                margin: 0;
            }
            .controls-panel, nav, footer, .bg-glow, .bg-glow-2 {
                display: none !important;
            }
            .container {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .report-wrapper {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                page-break-inside: avoid;
            }
            .excel-grid-table {
                font-size: 0.55rem; /* Downscale font size slightly so the large 31-day table fits landscape page width */
                width: 100% !important;
            }
            .excel-grid-table th, .excel-grid-table td {
                padding: 2px 3px !important;
            }
            /* Hide vertical scrollbar containers on print */
            div[style*="overflow-x: auto"] {
                overflow: visible !important;
                overflow-x: visible !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container" style="max-width: 1350px; padding-top: 1rem;">
        <!-- Breadcrumb Nav -->
        <nav aria-label="Breadcrumb">
            <a href="index.html" class="back-nav" style="text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                <i class="fas fa-arrow-left"></i> Back to Attendance Dashboard
            </a>
        </nav>

        <!-- Controls panel -->
        <section class="controls-panel glass-panel">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <label for="class-select" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary);">Select Class:</label>
                    <select id="class-select" style="border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); outline: none; cursor: pointer;">
                        <option value="">Loading classes...</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <label for="month-picker" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary);">Select Month:</label>
                    <input type="month" id="month-picker" style="border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); outline: none; cursor: pointer;">
                </div>
            </div>
            <div style="display: flex; gap: 0.75rem;">
                <button class="btn btn-outline" id="export-excel-btn" style="color: #107c41; border-color: #107c41;">
                    <i class="fas fa-file-excel"></i> Export to Excel (.xlsx)
                </button>
                <button class="btn btn-primary" id="print-btn" onclick="window.print()">
                    <i class="fas fa-print"></i> Print Report
                </button>
                <button class="btn btn-primary" id="export-pdf-btn" style="background: var(--danger); border-color: var(--danger-border); display: none;">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
            </div>
        </section>

        <!-- Monthly Report Container -->
        <div id="reports-container"></div>

        <footer style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem;">
            <p>&copy; 2026 Class Monthly Attendance System. Printable Sheet Mode.</p>
        </footer>
    </div>

    <!-- Script to calculate and draw grid -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Dark theme detection (applies to page background but keeps printable report page white)
            const isDarkMode = localStorage.getItem('theme') === 'dark';
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            }

            const monthPicker = document.getElementById('month-picker');
            const classSelect = document.getElementById('class-select');
            const reportsContainer = document.getElementById('reports-container');

            // Timezone-safe local date formatting helpers
            function formatLocalDate(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            // Parse selected date/month from URL params or default to current month
            const urlParams = new URLSearchParams(window.location.search);
            const dateQuery = urlParams.get('date');
            let initialDate = new Date();
            if (dateQuery) {
                const p = dateQuery.split('-').map(Number);
                if (p.length === 3) {
                    initialDate = new Date(p[0], p[1] - 1, p[2]);
                }
            }

            const currentYYYY = initialDate.getFullYear();
            const currentMM = String(initialDate.getMonth() + 1).padStart(2, '0');
            monthPicker.value = `${currentYYYY}-${currentMM}`;

            let currentClassId = urlParams.get('class') || localStorage.getItem('current_class_id') || '';
            const initialAuth = getAuthUser();
            if (initialAuth && (initialAuth.role === 'student' || initialAuth.role === 'Student')) {
                const sYear = String(initialAuth.year || '').trim();
                const sSec = String(initialAuth.section || '').trim();
                if (initialAuth.classId) {
                    currentClassId = initialAuth.classId;
                } else if (sYear && sSec) {
                    currentClassId = `${sYear}_${sSec}`;
                }
            }
            let currentClassData = {};
            let roster = [];
            let history = {};
            let globalHolidays = [];
            let unsubscribeClassListener = null;

            // Helper to get month name
            function getMonthName(monthIndex) {
                const months = [
                    "January", "February", "March", "April", "May", "June", 
                    "July", "August", "September", "October", "November", "December"
                ];
                return months[monthIndex];
            }

            // Function to resolve current section info dynamically
            function getSectionDetails() {
                let year = currentClassData.year;
                let section = currentClassData.section;
                let dept = currentClassData.department || 'DS';
                let branch = currentClassData.branch || 'CSE';

                if (!year || !section) {
                    if (currentClassId && currentClassId.includes('_')) {
                        const parts = currentClassId.split('_');
                        year = year || parts[0];
                        section = section || parts[1];
                    }
                }

                year = year || 'IV';
                section = section || 'D';
                dept = dept || 'DS';
                branch = branch || 'CSE';

                const formattedSection = `SECTION ${year} - ${section}`;
                const formattedCode = `${year}-${section}`;
                const deptTitle = (dept === 'DS' || dept === 'DATA SCIENCE')
                    ? 'DEPARTMENT OF COMPUTER SCIENCE AND ENGINEERING (DATA SCIENCE)'
                    : `DEPARTMENT OF ${dept}`;

                return {
                    year,
                    section,
                    dept,
                    branch,
                    formattedSection,
                    formattedCode,
                    deptTitle
                };
            }

            // Helper to find daily records across single day key or period keys
            function getDayRecord(dateKey) {
                const parts = dateKey.split('-').map(Number);
                const dObj = new Date(parts[0], parts[1] - 1, parts[2]);
                const isSun = dObj.getDay() === 0;
                
                // 1. Sunday check
                if (isSun) {
                    return { isSunday: true, isHoliday: true, holidayReason: "Sunday", attendance: {}, hasActualAttendance: false, studentStatus: {} };
                }

                // 2. Global holiday check
                const globalHol = globalHolidays.find(h => {
                    if (typeof h === 'string') return h === dateKey;
                    return h && (h.date === dateKey || h.id === dateKey);
                });
                if (globalHol) {
                    return { isSunday: false, isHoliday: true, holidayReason: (globalHol && globalHol.reason) ? globalHol.reason : "Holiday", attendance: {}, hasActualAttendance: false, studentStatus: {} };
                }

                // 3. Find ALL matching keys in Firestore history for this dateKey
                const keys = Object.keys(history || {});
                const matchingKeys = keys.filter(k => {
                    if (k === dateKey) return true;
                    if (k === `${currentClassId}_${dateKey}`) return true;
                    if (k.startsWith(`${currentClassId}_${dateKey}_`)) return true;
                    if (k.startsWith(`${dateKey}_P`)) return true;
                    if (k.endsWith(`_${dateKey}`)) return true;
                    
                    // Match class prefix variation if classId is IV_D or IV_CSE_DS_D
                    const altClass = currentClassId.includes('_') ? currentClassId.replace(/_CSE_DS/g, '') : currentClassId;
                    if (altClass && (k === `${altClass}_${dateKey}` || k.startsWith(`${altClass}_${dateKey}_`))) return true;

                    // Match date with standard delimiters
                    if (k.includes(dateKey)) {
                        const re = new RegExp(`(^|_)${dateKey}(_|$|P)`);
                        if (re.test(k)) return true;
                    }

                    // Check if record has date field matching dateKey
                    const rec = history[k];
                    if (rec && typeof rec === 'object') {
                        if (rec.date === dateKey) return true;
                        if (rec.date && typeof rec.date.toDate === 'function') {
                            const d = rec.date.toDate();
                            const y = d.getFullYear();
                            const m = String(d.getMonth() + 1).padStart(2, '0');
                            const day = String(d.getDate()).padStart(2, '0');
                            if (`${y}-${m}-${day}` === dateKey) return true;
                        }
                    }
                    return false;
                });

                if (matchingKeys.length === 0) {
                    return null; // Genuinely no session conducted on this date
                }

                let hasActualAttendance = false;
                let isRecordedHoliday = false;
                let holidayReason = "";
                const studentStatus = {};

                // Default all students in roster to 'present' for this conducted instructional day
                if (Array.isArray(roster)) {
                    roster.forEach(s => {
                        if (s && s.rollNo) {
                            studentStatus[s.rollNo.trim().toUpperCase()] = 'present';
                        }
                    });
                }

                matchingKeys.forEach(pk => {
                    const pRec = history[pk];
                    if (!pRec) return;

                    if (pRec.isHoliday) {
                        isRecordedHoliday = true;
                        holidayReason = pRec.holidayReason || holidayReason || "Holiday";
                    }

                    if (pRec.attendance && typeof pRec.attendance === 'object') {
                        const attKeys = Object.keys(pRec.attendance);
                        if (attKeys.length > 0) {
                            hasActualAttendance = true;
                            attKeys.forEach(roll => {
                                const normRoll = String(roll).trim().toUpperCase();
                                const val = String(pRec.attendance[roll]).trim().toLowerCase();
                                if (val === 'absent' || val === 'ab' || val === 'a') {
                                    studentStatus[normRoll] = 'absent';
                                } else if (val === 'leave' || val === 'l') {
                                    if (studentStatus[normRoll] !== 'absent') {
                                        studentStatus[normRoll] = 'leave';
                                    }
                                } else if (val === 'present' || val === 'p') {
                                    if (!studentStatus[normRoll]) {
                                        studentStatus[normRoll] = 'present';
                                    }
                                }
                            });
                        }
                    } else if (pRec.hasActualAttendance || pRec.period || pRec.subjectName || pRec.subjectCode) {
                        hasActualAttendance = true;
                    }
                });

                if (isRecordedHoliday && !hasActualAttendance) {
                    return { isSunday: false, isHoliday: true, holidayReason: holidayReason || "Holiday", hasActualAttendance: false, studentStatus: {} };
                }

                // Conducted semester check: any weekday Mon-Sat between 2026-07-06 and today
                const todayStr = formatLocalDate(new Date());
                const isPastOrToday = dateKey <= todayStr;
                const isSemesterWorkingDay = dateKey >= '2026-07-06' && isPastOrToday;

                if (hasActualAttendance || isSemesterWorkingDay) {
                    return {
                        isSunday: false,
                        isHoliday: false,
                        holidayReason: "",
                        hasActualAttendance: true,
                        studentStatus: studentStatus
                    };
                }

                return null;
            }

            // Build Monthly Grid - Immediately rendered
            function buildMonthlyGrid() {
                const secDetails = getSectionDetails();
                document.title = `Monthly Attendance Report - ${secDetails.formattedSection}`;
                reportsContainer.innerHTML = '';

                if (!roster || roster.length === 0) {
                    reportsContainer.innerHTML = `
                        <div style="text-align: center; padding: 3rem; background: white; border-radius: 8px; border: 1px solid #ccc;">
                            <i class="fas fa-users-slash fa-3x" style="color: #94a3b8; margin-bottom: 1rem;"></i>
                            <h3 style="color: #334155;">No students in roster for this class</h3>
                            <p style="color: #64748b;">Please select another class or add students in the admin panel.</p>
                        </div>
                    `;
                    return;
                }

                const pickerVal = monthPicker.value; // YYYY-MM
                if (!pickerVal) return;
                const [selectedYear, selectedMonth] = pickerVal.split('-').map(Number);
                const monthIndex = selectedMonth - 1;

                // Determine days in selected month
                const totalDays = new Date(selectedYear, selectedMonth, 0).getDate();

                // Generate dates for the month
                const monthDates = [];
                for (let d = 1; d <= totalDays; d++) {
                    const key = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const label = String(d).padStart(2, '0');
                    const dateObj = new Date(selectedYear, monthIndex, d);
                    const isSunday = dateObj.getDay() === 0;
                    monthDates.push({ key, label, day: d, isSunday, dateObj });
                }

                // Calculate total active working sessions in this month (excluding logged holidays and Sundays)
                let schoolDaysCount = 0;
                monthDates.forEach(col => {
                    const record = getDayRecord(col.key);
                    const globalHol = globalHolidays.find(h => (typeof h === 'string' ? h === col.key : (h && (h.date === col.key || h.id === col.key))));
                    const isHoliday = col.isSunday || (record && record.isHoliday) || globalHol;
                    if (!isHoliday && record && record.hasActualAttendance) {
                        schoolDaysCount++;
                    }
                });

                // Build wrapper HTML
                const wrapper = document.createElement('main');
                wrapper.className = 'report-wrapper';

                // Headers HTML
                let dateHeadersHTML = '';
                monthDates.forEach(col => {
                    dateHeadersHTML += `<th style="width: 25px; min-width: 25px; text-align: center; font-size: 0.7rem;">${col.label}</th>`;
                });

                // Student Rows
                const presenteesPerDay = Array(monthDates.length).fill(0);
                let tbodyHTML = '';

                roster.sort((a,b) => (a.rollNo || '').localeCompare(b.rollNo || '')).forEach((student, index) => {
                    let rowHTML = `
                        <tr>
                            <td style="background-color: #f2f2f2; font-weight: 700; text-align: center;">${index + 1}</td>
                            <td style="font-weight: 700; text-align: center; white-space: nowrap;">${student.rollNo}</td>
                            <td class="student-name-cell">${student.name}</td>
                    `;

                    let presentCount = 0;
                    monthDates.forEach((col, colIdx) => {
                        const record = getDayRecord(col.key);
                        const isSunday = col.isSunday || (record && record.isSunday);
                        const isHoliday = (record && record.isHoliday);
                        
                        if (isSunday) {
                            if (index === 0) {
                                rowHTML += `<td rowspan="${roster.length}" style="background-color: #fef08a; color: #4f46e5; font-weight: 700; text-align: center; font-size: 0.65rem; line-height: 1.2; padding: 2px 0; word-break: break-all; width: 25px; min-width: 25px; vertical-align: middle;">S<br>U<br>N<br>D<br>A<br>Y</td>`;
                            }
                        } else if (isHoliday) {
                            if (index === 0) {
                                const reason = (record && record.holidayReason) ? record.holidayReason : "Holiday";
                                const stackedReason = reason.substring(0, 10).toUpperCase().split('').join('<br>');
                                rowHTML += `<td rowspan="${roster.length}" style="background-color: #fef08a; color: #b45309; font-weight: 700; text-align: center; font-size: 0.65rem; line-height: 1.2; padding: 2px 0; word-break: break-all; width: 25px; min-width: 25px; vertical-align: middle;" title="${reason}">${stackedReason}</td>`;
                            }
                        } else if (record && record.hasActualAttendance) {
                            const normRoll = (student.rollNo || '').trim().toUpperCase();
                            const status = record.studentStatus ? (record.studentStatus[normRoll] || "present") : "present";
                            
                            if (status === "absent") {
                                rowHTML += `<td class="absent-cell" style="text-align: center; color: #dc2626; font-weight: 700; background-color: #fee2e2;">AB</td>`;
                            } else if (status === "leave") {
                                rowHTML += `<td style="text-align: center; color: #b45309; font-weight: 700; background-color: #fef3c7;">L</td>`;
                            } else {
                                presentCount++;
                                presenteesPerDay[colIdx]++;
                                rowHTML += `<td style="text-align: center; font-weight: 600; color: #1e293b;">${presentCount}</td>`;
                            }
                        } else {
                            rowHTML += `<td style="text-align: center; color: #94a3b8;">-</td>`;
                        }
                    });

                    const percentage = schoolDaysCount > 0 
                        ? ((presentCount / schoolDaysCount) * 100).toFixed(2)
                        : "0.00";

                    rowHTML += `
                        <td style="font-weight: 700; background-color: #f2f2f2; text-align: center; color: #1e293b;">${presentCount}</td>
                        <td style="font-weight: 700; background-color: #f2f2f2; text-align: center; color: #1e293b;">${percentage}%</td>
                        </tr>
                    `;
                    tbodyHTML += rowHTML;
                });

                // Totals row
                let totalsHTML = `
                    <tr class="totals-row">
                        <td colspan="3" style="text-align: right; padding-right: 12px; font-weight: 800;">TOTAL PRESENTEE PER DAY</td>
                `;
                monthDates.forEach((col, colIdx) => {
                    const record = getDayRecord(col.key);
                    const isSunday = col.isSunday || (record && record.isSunday);
                    const isHoliday = (record && record.isHoliday);
                    
                    if (isSunday) {
                        totalsHTML += `<td style="font-weight: 700; background-color: #fef08a; color: #4f46e5; text-align: center; font-size: 0.6rem;">SUN</td>`;
                    } else if (isHoliday) {
                        const shortReason = ((record && record.holidayReason) ? record.holidayReason : "HOL").substring(0, 3).toUpperCase();
                        totalsHTML += `<td style="font-weight: 700; background-color: #fef08a; color: #b45309; text-align: center; font-size: 0.6rem;" title="${(record && record.holidayReason) || 'Holiday'}">${shortReason}</td>`;
                    } else if (record && record.hasActualAttendance) {
                        totalsHTML += `<td style="text-align: center; font-weight: 700;">${presenteesPerDay[colIdx]}</td>`;
                    } else {
                        totalsHTML += `<td style="text-align: center; color: #94a3b8;">-</td>`;
                    }
                });
                totalsHTML += `<td colspan="2" style="background-color:#e2e8f0;"></td></tr>`;

                // Assemble HTML
                wrapper.innerHTML = `
                    <div style="width: 100%; border-bottom: 2px solid #000; padding-bottom: 0.5rem; margin-bottom: 1rem; text-align: center;">
                        <img src="logo.png" alt="College Logo" style="height: 70px; margin-bottom: 0.5rem; display: block; margin-left: auto; margin-right: auto; content: url(logo.png); filter: none;" onerror="this.style.display='none'">
                        <div class="college-info">
                            <h2>MALLA REDDY COLLEGE OF ENGINEERING & TECHNOLOGY</h2>
                            <h3>(Autonomous Institution - UGC, Govt. of India)</h3>
                            <p>Sponsored by Malla Reddy Educational Society. Affiliated to JNTUH, Hyderabad. Approved by AICTE, New Delhi.</p>
                            <p style="margin-top: 0.15rem;">Maisammaguda, Dhulapally, Secunderabad - 500100, Telangana, India.</p>
                        </div>
                    </div>

                    <div class="report-subtitle">
                        ${secDetails.deptTitle}
                    </div>
                    <div class="section-badge">
                        MONTHLY ATTENDANCE REGISTER - ${getMonthName(monthIndex).toUpperCase()} ${selectedYear} (${secDetails.formattedSection})
                    </div>

                    <div style="width: 100%; overflow-x: auto; overscroll-behavior-x: none; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; margin-top: 1rem;">
                        <table class="excel-grid-table">
                            <thead>
                                <tr>
                                    <th rowspan="2" style="width: 35px;">S.No</th>
                                    <th rowspan="2" style="width: 100px;">Roll Number</th>
                                    <th rowspan="2" style="text-align: left; padding-left: 8px;">Student Name</th>
                                    <th colspan="${monthDates.length}" style="text-align: center;">Days of Month</th>
                                    <th rowspan="2" style="width: 60px;">Total Attended</th>
                                    <th rowspan="2" style="width: 70px;">% of Attendance</th>
                                </tr>
                                <tr>
                                    ${dateHeadersHTML}
                                </tr>
                            </thead>
                            <tbody>
                                ${tbodyHTML}
                                ${totalsHTML}
                            </tbody>
                        </table>
                    </div>

                    <div style="margin-top: 3rem; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.85rem; padding: 0 1.5rem;">
                        <span>CLASS INCHARGE</span>
                        <span>ATTENDANCE COORDINATOR</span>
                        <span>HEAD OF DEPARTMENT</span>
                    </div>
                `;

                reportsContainer.appendChild(wrapper);
            }

            // Function to bind snapshot listener to selected class doc in Firestore (Single Source of Truth)
            function subscribeToClass(classId) {
                if (unsubscribeClassListener) {
                    unsubscribeClassListener();
                    unsubscribeClassListener = null;
                }

                if (typeof db !== 'undefined' && classId) {
                    unsubscribeClassListener = db.collection('classes').doc(classId).onSnapshot(doc => {
                        if (doc.exists) {
                            currentClassData = doc.data();
                            roster = currentClassData.roster || [];
                            const remoteHistory = currentClassData.history || {};
                            let localHistory = {};
                            try { localHistory = JSON.parse(localStorage.getItem('attendance_history_' + classId) || '{}'); } catch(e){}
                            try { const g = JSON.parse(localStorage.getItem('attendance_history') || '{}'); localHistory = { ...g, ...localHistory }; } catch(e){}
                            history = { ...localHistory, ...remoteHistory };
                            buildMonthlyGrid();
                        } else {
                            const altId = classId.includes('_CSE_DS_') ? classId.replace('_CSE_DS_', '_') : 
                                          (classId.startsWith('IV_') ? classId.replace('IV_', 'IV_CSE_DS_') : 
                                          (classId.startsWith('III_') ? classId.replace('III_', 'III_CSE_DS_') : null));
                            if (altId && altId !== classId) {
                                db.collection('classes').doc(altId).get().then(altDoc => {
                                    if (altDoc.exists) {
                                        currentClassData = altDoc.data();
                                        roster = currentClassData.roster || [];
                                        const remoteHistory = currentClassData.history || {};
                                        let localHistory = {};
                                        try { localHistory = JSON.parse(localStorage.getItem('attendance_history_' + altId) || '{}'); } catch(e){}
                                        try { const g = JSON.parse(localStorage.getItem('attendance_history') || '{}'); localHistory = { ...g, ...localHistory }; } catch(e){}
                                        history = { ...localHistory, ...remoteHistory };
                                        buildMonthlyGrid();
                                        return;
                                    }
                                    roster = [];
                                    history = {};
                                    buildMonthlyGrid();
                                }).catch(() => {
                                    roster = [];
                                    history = {};
                                    buildMonthlyGrid();
                                });
                                return;
                            }
                            console.warn("Class document does not exist in Firestore:", classId);
                            roster = [];
                            history = {};
                            buildMonthlyGrid();
                        }
                    }, err => {
                        console.error("Firestore snapshot error on class:", err);
                    });
                }
            }

            // Helper to get logged-in user (synchronous from cache or fallback)
            function getAuthUser() {
                try {
                    if (typeof authManager !== 'undefined' && authManager.user) {
                        return authManager.user;
                    }
                    const raw = localStorage.getItem('authUser');
                    if (raw) return JSON.parse(raw);
                } catch (e) {}
                return null;
            }

            // Async helper to ensure user metadata (role, year, section) is fully loaded from Firestore if needed
            async function getAuthUserAsync() {
                let u = getAuthUser();
                if (typeof auth !== 'undefined' && auth.currentUser && typeof db !== 'undefined') {
                    if (!u || !u.role || (u.role === 'student' && (!u.year || !u.section))) {
                        try {
                            const userDoc = await db.collection('users').doc(auth.currentUser.uid).get();
                            if (userDoc.exists) {
                                const d = userDoc.data();
                                u = Object.assign({}, u || {}, d, { uid: auth.currentUser.uid, email: auth.currentUser.email });
                                localStorage.setItem('authUser', JSON.stringify(u));
                                if (typeof authManager !== 'undefined') authManager.user = u;
                            }
                        } catch (err) {
                            console.warn("Could not fetch user metadata from Firestore:", err);
                        }
                    }
                }
                return u;
            }

            // Load Classes from Firestore
            async function loadClasses() {
                try {
                    if (typeof db !== 'undefined') {
                        // Load holidays from Firestore
                        try {
                            const holSnap = await db.collection('holidays').get();
                            globalHolidays = [];
                            holSnap.forEach(d => {
                                const h = d.data();
                                globalHolidays.push(h.date ? h : { date: d.id, ...h });
                            });
                        } catch (e) {
                            console.warn("Could not load holidays:", e);
                        }

                        // Ensure auth user profile is resolved
                        const currentUser = await getAuthUserAsync();
                        const isStudentUser = currentUser && (currentUser.role === 'student' || currentUser.role === 'Student');

                        // Load classes from Firestore
                        const classesSnap = await db.collection('classes').get();
                        classSelect.innerHTML = '';
                        
                        if (classesSnap.empty) {
                            classSelect.innerHTML = '<option value="">No classes available</option>';
                            buildMonthlyGrid();
                            return;
                        }

                        const rawDocs = [];
                        classesSnap.forEach(doc => rawDocs.push({ id: doc.id, data: doc.data() }));

                        let docs = rawDocs;
                        if (docs.length === 0) {
                            classSelect.innerHTML = '<option value="">No class assigned</option>';
                            buildMonthlyGrid();
                            return;
                        }

                        docs.sort((a, b) => {
                            const nameA = `${a.data.year || ''} ${a.data.section || ''}`;
                            const nameB = `${b.data.year || ''} ${b.data.section || ''}`;
                            return nameA.localeCompare(nameB);
                        });

                        const availableIds = [];
                        docs.forEach(({ id, data }) => {
                            availableIds.push(id);
                            const opt = document.createElement('option');
                            opt.value = id;
                            const yr = data.year || '';
                            const br = data.branch || 'CSE';
                            const dp = data.department || 'DS';
                            const sc = data.section || '';
                            opt.textContent = `${yr} ${br} ${dp} ${sc}`.trim() || id;
                            classSelect.appendChild(opt);
                        });

                        // Always unlocked
                        classSelect.disabled = false;
                        classSelect.style.cursor = 'pointer';
                        classSelect.style.opacity = '1';
                        classSelect.removeAttribute('title');
                        const labelEl = document.querySelector('label[for="class-select"]');
                        if (labelEl) {
                            labelEl.textContent = 'Select Class:';
                        }

                        let resolvedClassId = null;
                        // Smart class resolution: handle IV_CSE_DS_D vs IV_D, URL param, or localStorage
                        if (currentClassId) {
                            if (availableIds.includes(currentClassId)) {
                                resolvedClassId = currentClassId;
                            } else {
                                // Try normalize: remove branch/dept e.g. IV_CSE_DS_D -> IV_D
                                const parts = currentClassId.split('_');
                                if (parts.length >= 2) {
                                    const candidate = `${parts[0]}_${parts[parts.length - 1]}`;
                                    if (availableIds.includes(candidate)) {
                                        resolvedClassId = candidate;
                                    }
                                }
                            }
                        }

                        // Prefer student's enrolled class if available
                        if (!resolvedClassId && isStudentUser) {
                            const sYear = String(currentUser.year || '').trim().toUpperCase();
                            const sSec = String(currentUser.section || '').trim().toUpperCase();
                            const sCandidate = availableIds.find(id => id.includes(sYear) && id.includes(sSec));
                            if (sCandidate) resolvedClassId = sCandidate;
                        }

                        // Fallback to IV_D or first available class
                        if (!resolvedClassId) {
                            if (availableIds.includes('IV_D')) {
                                resolvedClassId = 'IV_D';
                            } else if (availableIds.length > 0) {
                                resolvedClassId = availableIds[0];
                            }
                        }

                        currentClassId = resolvedClassId || (availableIds.length > 0 ? availableIds[0] : '');
                        if (currentClassId) {
                            classSelect.value = currentClassId;
                            localStorage.setItem('current_class_id', currentClassId);
                            subscribeToClass(currentClassId);
                        }
                    }
                } catch (err) {
                    console.error("Error loading classes from Firestore:", err);
                }
            }

            classSelect.addEventListener('change', () => {
                currentClassId = classSelect.value;
                localStorage.setItem('current_class_id', currentClassId);
                subscribeToClass(currentClassId);
            });

            monthPicker.addEventListener('change', buildMonthlyGrid);

            // Export to Excel logic
            document.getElementById('export-excel-btn').addEventListener('click', () => {
                const table = document.querySelector(".excel-grid-table");
                if (!table) return;

                const pickerVal = monthPicker.value;
                const [selectedYear, selectedMonth] = pickerVal.split('-').map(Number);
                const monthName = getMonthName(selectedMonth - 1);

                const secDetails = getSectionDetails();
                const wb = XLSX.utils.table_to_book(table, { raw: true });
                XLSX.writeFile(wb, `Monthly_Attendance_Report_${secDetails.formattedCode}_${monthName}_${selectedYear}.xlsx`);
            });

            // Export to PDF logic
            document.getElementById('export-pdf-btn').addEventListener('click', () => {
                const element = document.getElementById('reports-container');
                if (!element) return;
                
                const pickerVal = monthPicker.value;
                const [selectedYear, selectedMonth] = pickerVal.split('-').map(Number);
                const monthName = getMonthName(selectedMonth - 1);

                const opt = {
                    margin:       0.5,
                    filename:     `Monthly_Attendance_Report_${monthName}_${selectedYear}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
                };
                
                html2pdf().set(opt).from(element).save();
            });

            // Toggle Print/PDF buttons based on Native App presence
            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                const printBtn = document.getElementById('print-btn');
                if (printBtn) printBtn.style.display = 'none';
                
                const pdfBtn = document.getElementById('export-pdf-btn');
                if (pdfBtn) pdfBtn.style.display = 'inline-flex';
            }

            // Listen to auth state so Firestore query runs with valid credentials
            auth.onAuthStateChanged(user => {
                if (user) {
                    loadClasses();
                } else {
                    loadClasses(); // still attempt to load
                }
            });
        });
    </script>
</body>
</html>
