<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Attendance Register - MRCET</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SheetJS library to export genuine Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* Exact Styles from Monthly Report */
        .report-wrapper {
            background-color: #ffffff !important;
            color: #000000 !important;
            padding: 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid #ccc;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }

        .dark-mode .report-wrapper {
            background-color: #ffffff !important;
            color: #000000 !important;
            border-color: #bbbbbb;
        }

        .report-wrapper,
        .report-wrapper * {
            color: #000000;
        }

        /* College Header Styling */
        .college-header {
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            align-items: center;
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }

        .college-info h2 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: #4b0082 !important;
            margin-bottom: 0.15rem;
        }

        .college-info h3 {
            font-size: 0.95rem;
            color: red !important;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .college-info p {
            font-size: 0.8rem;
            color: #333333 !important;
            font-weight: 600;
            line-height: 1.3;
        }

        .report-subtitle {
            text-align: center;
            font-weight: 800;
            border-bottom: 1.5px solid #000;
            padding: 0.35rem 0;
            font-size: 0.95rem;
            color: #000000 !important;
        }

        .section-badge {
            text-align: center;
            font-weight: 800;
            font-size: 0.88rem;
            background-color: #e2e8f0 !important;
            color: #000000 !important;
            padding: 0.4rem 0.75rem;
            border: 1px solid #000;
            margin: 0.5rem 0 1rem 0;
            line-height: 1.4;
        }

        /* Excel grid table formatting */
        .excel-grid-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            color: #000000 !important;
        }

        .excel-grid-table th, 
        .excel-grid-table td {
            border: 1px solid #000000 !important;
            padding: 4px 6px;
            vertical-align: middle;
            color: #000000 !important;
        }

        .excel-grid-table th {
            background-color: #f2f2f2 !important;
            font-weight: 800 !important;
            text-align: center;
            color: #000000 !important;
        }

        .excel-grid-table th span {
            color: #000000 !important;
        }

        .excel-grid-table td {
            text-align: center;
            font-weight: 600;
            color: #000000 !important;
        }

        .excel-grid-table td.student-name-cell {
            text-align: left;
            padding-left: 8px;
            font-weight: 600;
            white-space: nowrap;
            color: #000000 !important;
        }

        .excel-grid-table td.absent-cell {
            color: red !important;
            font-weight: 800 !important;
            background-color: #fee2e2 !important;
        }

        .excel-grid-table tr.totals-row td {
            font-weight: 800 !important;
            background-color: #f2f2f2 !important;
            color: #000000 !important;
        }

        .excel-grid-table tr:hover {
            background-color: rgba(79, 70, 229, 0.05);
        }

        /* Controls Panel */
        .controls-panel {
            max-width: 1350px;
            margin: 0 auto 1.5rem auto;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.25rem;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .filter-item label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-item select, 
        .filter-item input {
            border: 1px solid var(--card-border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.45rem 0.75rem;
            border-radius: var(--radius-sm);
            outline: none;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 0.5cm;
            }
            body {
                background: white !important;
                color: black !important;
                padding: 0;
                margin: 0;
            }
            .controls-panel, nav, footer, .bg-glow, .bg-glow-2 {
                display: none !important;
            }
            .container {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .report-wrapper {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                page-break-inside: avoid;
            }
            .excel-grid-table {
                font-size: 0.58rem;
                width: 100% !important;
            }
            .excel-grid-table th, .excel-grid-table td {
                padding: 2px 3px !important;
            }
            div[style*="overflow-x: auto"] {
                overflow: visible !important;
                overflow-x: visible !important;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container" style="max-width: 1400px; padding-top: 1rem;">
        <!-- Breadcrumb Nav -->
        <nav aria-label="Breadcrumb" style="margin-bottom: 1rem;">
            <a href="index.html" class="back-nav" style="text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                <i class="fas fa-arrow-left"></i> Back to Attendance Dashboard
            </a>
        </nav>

        <!-- Controls Panel -->
        <section class="controls-panel glass-panel">
            <div class="filter-group">
                <div class="filter-item">
                    <label for="class-select"><i class="fas fa-graduation-cap" style="color: var(--primary);"></i> Class / Section</label>
                    <select id="class-select" style="min-width: 190px;">
                        <option value="IV_A">IV CSE(DS) - Section A</option>
                        <option value="IV_B">IV CSE(DS) - Section B</option>
                        <option value="IV_C">IV CSE(DS) - Section C</option>
                        <option value="IV_D" selected>IV CSE(DS) - Section D</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="subject-select"><i class="fas fa-book" style="color: var(--primary);"></i> Subject</label>
                    <select id="subject-select" style="min-width: 270px;">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="filter-item">
                    <label for="start-date"><i class="far fa-calendar-alt" style="color: var(--info);"></i> Start Date</label>
                    <input type="date" id="start-date" value="2026-07-06">
                </div>

                <div class="filter-item">
                    <label for="end-date"><i class="far fa-calendar-check" style="color: var(--success);"></i> End Date</label>
                    <input type="date" id="end-date">
                </div>

                <div class="filter-item" style="align-self: flex-end;">
                    <button class="btn btn-primary" id="generate-btn" style="height: 38px; padding: 0 1.25rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem;">
                        <i class="fas fa-sync-alt"></i> Generate Register
                    </button>
                </div>
            </div>

            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="export-excel-btn" style="color: #107c41; border-color: #107c41;" title="Export genuine Excel register">
                    <i class="fas fa-file-excel"></i> Export to Excel (.xlsx)
                </button>
                <button class="btn btn-primary" id="print-btn" onclick="window.print()" title="Print A4 Landscape Register">
                    <i class="fas fa-print"></i> Print Report
                </button>
                <button class="btn btn-primary" id="export-pdf-btn" style="background: var(--danger); border-color: var(--danger-border); display: none;">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
            </div>
        </section>

        <!-- Loading state -->
        <div id="loading" style="display: none; text-align: center; padding: 2rem;">
            <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
            <p style="margin-top: 0.75rem; color: var(--text-secondary); font-weight: 600;">Generating Monthly Format Register...</p>
        </div>

        <!-- Monthly Format Register Container -->
        <div id="reports-container"></div>

        <footer style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem;">
            <p>&copy; 2026 Class Attendance System. Printable Sheet Mode.</p>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>

    <!-- App Logic Scripts -->
    <script src="auth.js"></script>
    <script src="timetable-data.js"></script>
    <script src="subject-report.js"></script>
</body>
</html>
