<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Attendance Report - MRCET</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS library to export genuine Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>

    <!-- App Configuration and Auth -->
    <script src="auth.js"></script>
    <style>
        /* Specific Styles for Excel Weekly Report */
        .report-wrapper {
            background-color: white;
            color: #000;
            padding: 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid #ccc;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }

        .dark-mode .report-wrapper {
            background-color: #ffffff;
            color: #000000;
            border-color: #bbbbbb;
        }

        /* College Header Styling */
        .college-header {
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            align-items: center;
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .college-info h2 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: #4b0082;
            margin-bottom: 0.15rem;
        }

        .college-info h3 {
            font-size: 0.95rem;
            color: red;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .college-info p {
            font-size: 0.8rem;
            color: #333;
            font-weight: 600;
            line-height: 1.3;
        }

        .report-subtitle {
            text-align: center;
            font-weight: 800;
            border-bottom: 1.5px solid #000;
            padding: 0.35rem 0;
            font-size: 0.95rem;
        }

        .section-badge {
            text-align: center;
            font-weight: 800;
            font-size: 0.9rem;
            background-color: #e2e8f0;
            padding: 0.3rem;
            border: 1px solid #000;
            margin: 0.5rem 0 1rem 0;
        }

        /* Excel grid table formatting */
        .excel-grid-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
        }

        .excel-grid-table th, 
        .excel-grid-table td {
            border: 1px solid #000;
            padding: 4px 6px;
            vertical-align: middle;
        }

        .excel-grid-table th {
            background-color: #f2f2f2;
            font-weight: 700;
            text-align: center;
        }

        .excel-grid-table td {
            text-align: center;
            font-weight: 500;
        }

        .excel-grid-table td.student-name-cell {
            text-align: left;
            padding-left: 8px;
            font-weight: 600;
            white-space: nowrap;
        }

        .excel-grid-table td.absent-cell {
            color: red;
            font-weight: 700;
            background-color: #fee2e2;
        }

        .excel-grid-table tr.totals-row td {
            font-weight: 700;
            background-color: #f2f2f2;
        }

        .excel-grid-table tr:hover {
            background-color: rgba(79, 70, 229, 0.05);
        }

        /* Controls Panel */
        .controls-panel {
            max-width: 1250px;
            margin: 0 auto 1.5rem auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 0.5cm;
            }
            body {
                background: white !important;
                color: black !important;
                padding: 0;
                margin: 0;
            }
            .controls-panel, nav, footer, .bg-glow, .bg-glow-2 {
                display: none !important;
            }
            .container {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .report-wrapper {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                page-break-inside: avoid;
            }
            .excel-grid-table {
                font-size: 0.65rem;
                width: 100% !important;
            }
            .excel-grid-table th, .excel-grid-table td {
                padding: 3px 4px !important;
            }
            div[style*="overflow-x: auto"] {
                overflow: visible !important;
                overflow-x: visible !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container" style="max-width: 1350px; padding-top: 1rem;">
        <!-- Breadcrumb Nav -->
        <nav aria-label="Breadcrumb">
            <a href="index.html" class="back-nav" style="text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                <i class="fas fa-arrow-left"></i> Back to Attendance Dashboard
            </a>
        </nav>

        <!-- Controls panel -->
        <section class="controls-panel glass-panel">
            <div style="display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="class-select" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary); white-space: nowrap;"><i class="fas fa-graduation-cap" style="color: var(--primary);"></i> Class:</label>
                    <select id="class-select" style="border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); outline: none; cursor: pointer; min-width: 170px;">
                        <option value="">Loading classes...</option>
                    </select>
                </div>

                <!-- Week Selector Dropdown & Stepper -->
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="week-select" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary); white-space: nowrap;"><i class="far fa-calendar-alt" style="color: var(--info);"></i> Week:</label>
                    <button type="button" id="prev-week-btn" title="Previous Week" style="background: var(--bg-secondary); border: 1px solid var(--card-border); color: var(--text-primary); padding: 0.4rem 0.65rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: bold;">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <select id="week-select" style="border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.88rem; font-weight: 600; padding: 0.4rem 0.6rem; border-radius: var(--radius-sm); outline: none; cursor: pointer; min-width: 240px;">
                        <!-- Dynamically populated with all semester weeks -->
                    </select>
                    <button type="button" id="next-week-btn" title="Next Week" style="background: var(--bg-secondary); border: 1px solid var(--card-border); color: var(--text-primary); padding: 0.4rem 0.65rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: bold;">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Date Picker Fallback -->
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="week-picker" style="font-weight: 700; font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap;">Date:</label>
                    <input type="date" id="week-picker" style="border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.88rem; font-weight: 600; padding: 0.35rem 0.5rem; border-radius: var(--radius-sm); outline: none; cursor: pointer;">
                </div>

                <div style="display: flex; align-items: center; gap: 0.4rem;">
                    <input type="checkbox" id="show-all-weeks-toggle" style="cursor: pointer; width: 1.1rem; height: 1.1rem; accent-color: var(--primary);">
                    <label for="show-all-weeks-toggle" style="font-weight: 700; font-size: 0.88rem; color: var(--text-secondary); cursor: pointer; white-space: nowrap;">Show all logged weeks</label>
                </div>
            </div>

            <div style="display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.25rem;">
                <button class="btn btn-outline" id="export-excel-btn" style="color: #107c41; border-color: #107c41; font-size: 0.85rem; padding: 0.4rem 0.75rem;">
                    <i class="fas fa-file-excel"></i> Export Excel (.xlsx)
                </button>
                <button class="btn btn-primary" id="print-btn" onclick="window.print()" style="font-size: 0.85rem; padding: 0.4rem 0.75rem;">
                    <i class="fas fa-print"></i> Print Sheet
                </button>
                <button class="btn btn-primary" id="export-pdf-btn" style="background: var(--danger); border-color: var(--danger-border); font-size: 0.85rem; padding: 0.4rem 0.75rem; display: none;">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
            </div>
        </section>

        <!-- Dynamic Reports Container -->
        <div id="reports-container"></div>

        <footer style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem;">
            <p>&copy; 2026 Class Weekly Attendance System. Printable Sheet Mode.</p>
        </footer>
    </div>

    <!-- Script to calculate and draw grid -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isDarkMode = localStorage.getItem('theme') === 'dark';
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            }

            const picker = document.getElementById('week-picker');
            const weekSelect = document.getElementById('week-select');
            const prevWeekBtn = document.getElementById('prev-week-btn');
            const nextWeekBtn = document.getElementById('next-week-btn');
            const classSelect = document.getElementById('class-select');
            const showAllToggle = document.getElementById('show-all-weeks-toggle');
            const reportsContainer = document.getElementById('reports-container');

            function formatLocalDate(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            function resolveClassId(rawId) {
                if (!rawId) return "";
                const clean = String(rawId).trim().toUpperCase();
                if (clean.includes("III") || clean.startsWith("3")) {
                    if (clean.endsWith("_D") || clean.endsWith(" D") || clean.endsWith("-D") || clean.includes("_D_") || clean.includes("SEC D") || clean.includes("SECTION D") || clean.includes("(DS)-D") || clean.includes("DS-D")) return "III_D";
                    if (clean.endsWith("_C") || clean.endsWith(" C") || clean.endsWith("-C") || clean.includes("_C_") || clean.includes("SEC C") || clean.includes("SECTION C") || clean.includes("(DS)-C") || clean.includes("DS-C")) return "III_C";
                    if (clean.endsWith("_B") || clean.endsWith(" B") || clean.endsWith("-B") || clean.includes("_B_") || clean.includes("SEC B") || clean.includes("SECTION B") || clean.includes("(DS)-B") || clean.includes("DS-B")) return "III_B";
                    if (clean.endsWith("_A") || clean.endsWith(" A") || clean.endsWith("-A") || clean.includes("_A_") || clean.includes("SEC A") || clean.includes("SECTION A") || clean.includes("(DS)-A") || clean.includes("DS-A")) return "III_A";
                }
                if (clean.includes("IV") || clean.startsWith("4")) {
                    if (clean.endsWith("_D") || clean.endsWith(" D") || clean.endsWith("-D") || clean.includes("_D_") || clean.includes("SEC D") || clean.includes("SECTION D") || clean.includes("(DS)-D") || clean.includes("DS-D")) return "IV_D";
                    if (clean.endsWith("_C") || clean.endsWith(" C") || clean.endsWith("-C") || clean.includes("_C_") || clean.includes("SEC C") || clean.includes("SECTION C") || clean.includes("(DS)-C") || clean.includes("DS-C")) return "IV_C";
                    if (clean.endsWith("_B") || clean.endsWith(" B") || clean.endsWith("-B") || clean.includes("_B_") || clean.includes("SEC B") || clean.includes("SECTION B") || clean.includes("(DS)-B") || clean.includes("DS-B")) return "IV_B";
                    if (clean.endsWith("_A") || clean.endsWith(" A") || clean.endsWith("-A") || clean.includes("_A_") || clean.includes("SEC A") || clean.includes("SECTION A") || clean.includes("(DS)-A") || clean.includes("DS-A")) return "IV_A";
                }
                return clean;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const dateQuery = urlParams.get('date');
            let selectedDateObj = new Date();
            if (dateQuery) {
                const p = dateQuery.split('-').map(Number);
                if (p.length === 3) selectedDateObj = new Date(p[0], p[1] - 1, p[2]);
            }
            picker.value = formatLocalDate(selectedDateObj);

            let currentClassId = urlParams.get('class') || localStorage.getItem('current_class_id') || '';
            const initialAuth = getAuthUser();
            if (initialAuth && (initialAuth.role === 'student' || initialAuth.role === 'Student')) {
                const sYear = String(initialAuth.year || '').trim();
                const sSec = String(initialAuth.section || '').trim();
                if (initialAuth.classId) {
                    currentClassId = initialAuth.classId;
                } else if (sYear && sSec) {
                    currentClassId = `${sYear}_${sSec}`;
                }
            }
            let currentClassData = {};
            let roster = [];
            let history = {};
            let globalHolidays = [];
            let unsubscribeClassListener = null;

            function getSectionDetails() {
                let year = currentClassData.year;
                let section = currentClassData.section;
                let dept = currentClassData.department || 'DS';
                let branch = currentClassData.branch || 'CSE';

                if (!year || !section) {
                    if (currentClassId && currentClassId.includes('_')) {
                        const parts = currentClassId.split('_');
                        year = year || parts[0];
                        section = section || parts[parts.length - 1];
                    }
                }

                year = year || 'IV';
                section = section || 'D';
                dept = dept || 'DS';
                branch = branch || 'CSE';

                const formattedSection = `SECTION ${year} - ${section}`;
                const formattedCode = `${year}-${section}`;
                const deptTitle = (dept === 'DS' || dept === 'DATA SCIENCE')
                    ? 'DEPARTMENT OF COMPUTER SCIENCE AND ENGINEERING (DATA SCIENCE)'
                    : `DEPARTMENT OF ${dept}`;

                return {
                    year,
                    section,
                    dept,
                    branch,
                    formattedSection,
                    formattedCode,
                    deptTitle
                };
            }

            function getMondayDate(dObj) {
                const d = new Date(dObj.getTime());
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                d.setDate(diff);
                return d;
            }

            function getSemesterWeekNumber(mondayObj) {
                const semStart = new Date(2026, 6, 6); // 2026-07-06 (Month 6 is July)
                const diffMs = mondayObj.getTime() - semStart.getTime();
                const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
                const weekNum = Math.floor(diffDays / 7) + 1;
                return weekNum > 0 ? weekNum : 1;
            }

            function getFormattedKey(dObj) {
                const y = dObj.getFullYear();
                const m = String(dObj.getMonth() + 1).padStart(2, '0');
                const d = String(dObj.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function getMondayKey(dateStr) {
                if (!dateStr) return getFormattedKey(getMondayDate(new Date()));
                const parts = dateStr.split('-').map(Number);
                if (parts.length !== 3 || isNaN(parts[0])) return getFormattedKey(getMondayDate(new Date()));
                const dObj = new Date(parts[0], parts[1] - 1, parts[2]);
                const mon = getMondayDate(dObj);
                return getFormattedKey(mon);
            }

            // Caches and indexes for high-speed rendering (zero lag)
            let dayRecordCache = {};
            let historyDateIndex = null;
            let holidayMap = new Map();

            function updateHolidayMap() {
                holidayMap = new Map();
                (globalHolidays || []).forEach(h => {
                    if (typeof h === 'string') {
                        holidayMap.set(h, "Holiday");
                    } else if (h && (h.date || h.id)) {
                        holidayMap.set(h.date || h.id, h.reason || "Holiday");
                    }
                });
            }

            function buildHistoryIndex() {
                dayRecordCache = {};
                historyDateIndex = {};
                const keys = Object.keys(history || {});
                for (let i = 0; i < keys.length; i++) {
                    const k = keys[i];
                    const rec = history[k];
                    if (!rec) continue;

                    let d = null;
                    if (typeof rec.date === 'string') {
                        d = rec.date;
                    } else if (rec.date && typeof rec.date.toDate === 'function') {
                        d = formatLocalDate(rec.date.toDate());
                    } else {
                        const m = k.match(/\d{4}-\d{2}-\d{2}/);
                        if (m) d = m[0];
                    }

                    if (d) {
                        if (!historyDateIndex[d]) historyDateIndex[d] = [];
                        historyDateIndex[d].push({ key: k, rec });
                    }
                }
            }

            function getAllSemesterMondayKeys() {
                const startStr = '2026-07-06';
                const [sy, sm, sd] = startStr.split('-').map(Number);
                const startDate = new Date(sy, sm - 1, sd);
                
                const today = new Date();
                let endDate = new Date(today);
                
                if (picker && picker.value) {
                    const [py, pm, pd] = picker.value.split('-').map(Number);
                    const pickerDate = new Date(py, pm - 1, pd);
                    if (pickerDate > endDate) {
                        endDate = pickerDate;
                    }
                }

                const mondays = [];
                let curr = getMondayDate(startDate);
                const endMon = getMondayDate(endDate);

                while (curr <= endMon) {
                    mondays.push(getFormattedKey(curr));
                    curr = new Date(curr.getTime() + 7 * 24 * 60 * 60 * 1000);
                }

                return mondays;
            }

            // Populate the Week Dropdown with all semester weeks
            function populateWeekDropdown() {
                const mondays = getAllSemesterMondayKeys();
                const currentMonKey = getMondayKey(picker.value || formatLocalDate(new Date()));
                const todayMonKey = getMondayKey(formatLocalDate(new Date()));
                const existingVal = weekSelect.value;

                let optionsHtml = '';
                mondays.slice().reverse().forEach(monKey => {
                    const parts = monKey.split('-').map(Number);
                    const monDate = new Date(parts[0], parts[1] - 1, parts[2]);
                    const satDate = new Date(monDate);
                    satDate.setDate(satDate.getDate() + 5);

                    const weekNum = getSemesterWeekNumber(monDate);
                    const monLabel = `${String(monDate.getDate()).padStart(2, '0')}/${String(monDate.getMonth() + 1).padStart(2, '0')}`;
                    const satLabel = `${String(satDate.getDate()).padStart(2, '0')}/${String(satDate.getMonth() + 1).padStart(2, '0')}/${satDate.getFullYear()}`;
                    
                    const isCurrent = monKey === todayMonKey;
                    const isSelected = monKey === (existingVal || currentMonKey);
                    optionsHtml += `<option value="${monKey}" ${isSelected ? 'selected' : ''}>Week ${weekNum} (${monLabel} - ${satLabel})${isCurrent ? ' — Current Week' : ''}</option>`;
                });

                weekSelect.innerHTML = optionsHtml;
                if (!weekSelect.value && weekSelect.options.length > 0) {
                    weekSelect.selectedIndex = 0;
                }
            }

            function getDayRecord(dateKey) {
                if (dayRecordCache[dateKey] !== undefined) {
                    return dayRecordCache[dateKey];
                }

                const parts = dateKey.split('-').map(Number);
                const dObj = new Date(parts[0], parts[1] - 1, parts[2]);
                if (dObj.getDay() === 0) {
                    const res = { isSunday: true, isHoliday: true, holidayReason: "Sunday", attendance: {}, hasActualAttendance: false };
                    dayRecordCache[dateKey] = res;
                    return res;
                }

                if (holidayMap.has(dateKey)) {
                    const res = { isSunday: false, isHoliday: true, holidayReason: holidayMap.get(dateKey) || "Holiday", attendance: {}, hasActualAttendance: false };
                    dayRecordCache[dateKey] = res;
                    return res;
                }

                if (!historyDateIndex) buildHistoryIndex();

                const matchedEntries = historyDateIndex[dateKey] || [];
                const mergedAttendance = {};
                let isHoliday = false;
                let holidayReason = "";
                let hasActualAttendance = false;

                for (let i = 0; i < matchedEntries.length; i++) {
                    const { rec } = matchedEntries[i];
                    if (!rec) continue;
                    if (rec.isHoliday) {
                        isHoliday = true;
                        holidayReason = rec.holidayReason || holidayReason || "Holiday";
                    }
                    if (rec.attendance && typeof rec.attendance === 'object') {
                        const attKeys = Object.keys(rec.attendance);
                        if (attKeys.length > 0) {
                            hasActualAttendance = true;
                            for (let j = 0; j < attKeys.length; j++) {
                                const roll = attKeys[j];
                                const normRoll = String(roll).trim().toUpperCase();
                                const val = String(rec.attendance[roll]).trim().toLowerCase();
                                if (val === 'absent' || val === 'ab' || val === 'a') {
                                    mergedAttendance[normRoll] = 'absent';
                                } else if (val === 'leave' || val === 'l') {
                                    if (mergedAttendance[normRoll] !== 'absent') {
                                        mergedAttendance[normRoll] = 'leave';
                                    }
                                } else if (val === 'present' || val === 'p') {
                                    if (!mergedAttendance[normRoll]) {
                                        mergedAttendance[normRoll] = 'present';
                                    }
                                }
                            }
                        }
                    } else if (rec.hasActualAttendance || rec.period || rec.subjectName || rec.subjectCode) {
                        hasActualAttendance = true;
                    }
                }

                if (isHoliday && !hasActualAttendance) {
                    const res = { isSunday: false, isHoliday: true, holidayReason: holidayReason || "Holiday", attendance: {}, hasActualAttendance: false };
                    dayRecordCache[dateKey] = res;
                    return res;
                }

                const todayStr = formatLocalDate(new Date());
                const isPastOrToday = dateKey <= todayStr;
                const isSemesterWorkingDay = dateKey >= '2026-07-06' && isPastOrToday;

                if (hasActualAttendance || isSemesterWorkingDay) {
                    const res = { isSunday: false, isHoliday: false, holidayReason: "", attendance: mergedAttendance, hasActualAttendance: true };
                    dayRecordCache[dateKey] = res;
                    return res;
                }

                dayRecordCache[dateKey] = null;
                return null;
            }

            function buildWeeklyGrid() {
                const secDetails = getSectionDetails();
                document.title = `Weekly Attendance Report - ${secDetails.formattedSection}`;
                reportsContainer.innerHTML = '';

                if (!roster || roster.length === 0) {
                    reportsContainer.innerHTML = `
                        <div style="text-align: center; padding: 3rem; background: white; border-radius: 8px; border: 1px solid #ccc;">
                            <i class="fas fa-users-slash fa-3x" style="color: #94a3b8; margin-bottom: 1rem;"></i>
                            <h3 style="color: #334155;">No students in roster for this class</h3>
                            <p style="color: #64748b;">Please select another class or add students in the admin panel.</p>
                        </div>
                    `;
                    return;
                }

                let mondayKeys = [];
                if (showAllToggle && showAllToggle.checked) {
                    mondayKeys = getAllSemesterMondayKeys();
                } else if (weekSelect && weekSelect.value) {
                    mondayKeys = [weekSelect.value];
                } else {
                    mondayKeys = [getMondayKey(picker.value)];
                }

                const sortedRoster = roster.slice().sort((a, b) => (a.rollNo || '').localeCompare(b.rollNo || ''));
                const fragment = document.createDocumentFragment();

                mondayKeys.forEach(mondayKey => {
                    const parts = mondayKey.split('-').map(Number);
                    const monday = new Date(parts[0], parts[1] - 1, parts[2]);

                    const weekDates = [];
                    for (let i = 0; i < 6; i++) {
                        const nextDate = new Date(monday);
                        nextDate.setDate(monday.getDate() + i);
                        const key = getFormattedKey(nextDate);
                        const label = `${String(nextDate.getDate()).padStart(2, '0')}-${String(nextDate.getMonth() + 1).padStart(2, '0')}-${nextDate.getFullYear()}`;
                        weekDates.push({ key, label });
                    }

                    // Precompute the 6 day records ONCE per week for all students
                    const weekRecordMap = {};
                    let schoolDaysCount = 0;
                    weekDates.forEach(col => {
                        const rec = getDayRecord(col.key);
                        weekRecordMap[col.key] = rec;
                        if (rec && !rec.isHoliday && rec.hasActualAttendance) {
                            schoolDaysCount++;
                        }
                    });

                    const wrapper = document.createElement('main');
                    wrapper.className = 'report-wrapper';

                    let dateHeadersHTML = '';
                    const dayLabels = ["MON", "TUE", "WED", "THU", "FRI", "SAT"];
                    weekDates.forEach((col, idx) => {
                        dateHeadersHTML += `<th style="width: 80px; min-width: 80px; text-align: center;"><div style="font-size: 0.65rem; color: #4f46e5; font-weight: 800;">${dayLabels[idx]}</div><div style="font-size: 0.75rem;">${col.label}</div></th>`;
                    });

                    const presenteesPerDay = Array(weekDates.length).fill(0);
                    let tbodyHTML = '';

                    sortedRoster.forEach((student, index) => {
                        const normRoll = (student.rollNo || '').trim().toUpperCase();
                        let rowHTML = `
                            <tr>
                                <td style="background-color: #f2f2f2; font-weight: 700; text-align: center;">${index + 1}</td>
                                <td style="font-weight: 700; text-align: center; white-space: nowrap;">${student.rollNo}</td>
                                <td class="student-name-cell">${student.name}</td>
                        `;

                        let presentCount = 0;
                        for (let colIdx = 0; colIdx < weekDates.length; colIdx++) {
                            const col = weekDates[colIdx];
                            const record = weekRecordMap[col.key];

                            if (!record) {
                                rowHTML += `<td style="text-align: center; color: #94a3b8;">-</td>`;
                            } else if (record.isHoliday) {
                                rowHTML += `<td style="background-color: #fef08a; color: #b45309; font-weight: 700; text-align: center; font-size: 0.65rem;" title="${record.holidayReason || 'Holiday'}">HOL</td>`;
                            } else if (record.hasActualAttendance) {
                                const attendance = record.attendance || {};
                                const status = attendance[normRoll] || attendance[student.rollNo] || "present";
                                
                                if (status === "absent") {
                                    rowHTML += `<td class="absent-cell" style="text-align: center; color: #dc2626; font-weight: 700; background-color: #fee2e2;">AB</td>`;
                                } else if (status === "leave") {
                                    rowHTML += `<td style="text-align: center; color: #b45309; font-weight: 700; background-color: #fef3c7;">L</td>`;
                                } else {
                                    presentCount++;
                                    presenteesPerDay[colIdx]++;
                                    rowHTML += `<td style="text-align: center; font-weight: 600; color: #1e293b;">${presentCount}</td>`;
                                }
                            } else {
                                rowHTML += `<td style="text-align: center; color: #94a3b8;">-</td>`;
                            }
                        }

                        const percentage = schoolDaysCount > 0 
                            ? ((presentCount / schoolDaysCount) * 100).toFixed(2)
                            : "0.00";

                        rowHTML += `
                            <td style="font-weight: 700; background-color: #f2f2f2; text-align: center; color: #1e293b;">${presentCount}</td>
                            <td style="font-weight: 700; background-color: #f2f2f2; text-align: center; color: #1e293b;">${percentage}%</td>
                            </tr>
                        `;
                        tbodyHTML += rowHTML;
                    });

                    let totalsHTML = `
                        <tr class="totals-row">
                            <td colspan="3" style="text-align: right; padding-right: 12px; font-weight: 800;">TOTAL PRESENTEE PER DAY</td>
                    `;
                    for (let colIdx = 0; colIdx < weekDates.length; colIdx++) {
                        const col = weekDates[colIdx];
                        const record = weekRecordMap[col.key];
                        
                        if (record && record.isHoliday) {
                            const shortReason = (record.holidayReason || "HOL").substring(0, 3).toUpperCase();
                            totalsHTML += `<td style="font-weight: 700; background-color: #fef08a; color: #b45309; text-align: center; font-size: 0.6rem;" title="${record.holidayReason || 'Holiday'}">${shortReason}</td>`;
                        } else if (record && record.hasActualAttendance) {
                            totalsHTML += `<td style="text-align: center; font-weight: 700;">${presenteesPerDay[colIdx]}</td>`;
                        } else {
                            totalsHTML += `<td style="text-align: center; color: #94a3b8;">-</td>`;
                        }
                    }
                    totalsHTML += `<td colspan="2" style="background-color:#e2e8f0;"></td></tr>`;

                    wrapper.innerHTML = `
                        <div style="width: 100%; border-bottom: 2px solid #000; padding-bottom: 0.5rem; margin-bottom: 1rem; text-align: center;">
                            <img src="logo.png" alt="College Logo" style="height: 70px; margin-bottom: 0.5rem; display: block; margin-left: auto; margin-right: auto; content: url(logo.png); filter: none;" onerror="this.style.display='none'">
                            <div class="college-info">
                                <h2>MALLA REDDY COLLEGE OF ENGINEERING & TECHNOLOGY</h2>
                                <h3>(Autonomous Institution - UGC, Govt. of India)</h3>
                                <p>Sponsored by Malla Reddy Educational Society. Affiliated to JNTUH, Hyderabad. Approved by AICTE, New Delhi.</p>
                                <p style="margin-top: 0.15rem;">Maisammaguda, Dhulapally, Secunderabad - 500100, Telangana, India.</p>
                            </div>
                        </div>

                        <div class="report-subtitle">
                            ${secDetails.deptTitle}
                        </div>
                        <div class="section-badge">
                            WEEKLY ATTENDANCE REGISTER - WEEK ${getSemesterWeekNumber(monday)}: ${weekDates[0].label} TO ${weekDates[5].label} (${secDetails.formattedSection})
                        </div>

                        <div style="width: 100%; overflow-x: auto; overscroll-behavior-x: none; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; margin-top: 1rem;">
                            <table class="excel-grid-table">
                                <thead>
                                    <tr>
                                        <th rowspan="2" style="width: 35px;">S.No</th>
                                        <th rowspan="2" style="width: 110px;">Roll Number</th>
                                        <th rowspan="2" style="text-align: left; padding-left: 8px;">Student Name</th>
                                        <th colspan="6" style="text-align: center;">Week Days Attendance (${weekDates[0].label} - ${weekDates[5].label})</th>
                                        <th rowspan="2" style="width: 70px;">Total Attended</th>
                                        <th rowspan="2" style="width: 75px;">% of Attendance</th>
                                    </tr>
                                    <tr>
                                        ${dateHeadersHTML}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tbodyHTML}
                                    ${totalsHTML}
                                </tbody>
                            </table>
                        </div>

                        <div style="margin-top: 3rem; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.85rem; padding: 0 1.5rem;">
                            <span>CLASS INCHARGE</span>
                            <span>ATTENDANCE COORDINATOR</span>
                            <span>HEAD OF DEPARTMENT</span>
                        </div>
                    `;
                    fragment.appendChild(wrapper);
                });

                reportsContainer.appendChild(fragment);
            }

            function subscribeToClass(classId) {
                if (unsubscribeClassListener) {
                    unsubscribeClassListener();
                    unsubscribeClassListener = null;
                }

                const resolvedId = resolveClassId(classId);

                if (typeof db !== 'undefined' && classId) {
                    unsubscribeClassListener = db.collection('classes').doc(classId).onSnapshot(doc => {
                        if (doc.exists) {
                            currentClassData = doc.data();
                            roster = currentClassData.roster || [];
                            if (!roster || roster.length === 0) {
                                try {
                                    const locR = JSON.parse(localStorage.getItem('attendance_roster_' + classId) || '[]');
                                    if (locR.length > 0) roster = locR;
                                } catch(e){}
                            }
                            history = currentClassData.history || {};
                            buildHistoryIndex();
                            updateHolidayMap();
                            populateWeekDropdown();
                            buildWeeklyGrid();
                        } else {
                            // Check alternative classId format if doc doesn't exist
                            const altId = (classId !== resolvedId) ? resolvedId : (classId.includes('_CSE_DS_') ? classId.replace('_CSE_DS_', '_') : classId);
                            if (altId && altId !== classId) {
                                db.collection('classes').doc(altId).get().then(altDoc => {
                                    if (altDoc.exists) {
                                        currentClassData = altDoc.data();
                                        roster = currentClassData.roster || [];
                                        if (!roster || roster.length === 0) {
                                            try {
                                                const locR = JSON.parse(localStorage.getItem('attendance_roster_' + altId) || '[]');
                                                if (locR.length > 0) roster = locR;
                                            } catch(e){}
                                        }
                                        history = currentClassData.history || {};
                                        buildHistoryIndex();
                                        updateHolidayMap();
                                        populateWeekDropdown();
                                        buildWeeklyGrid();
                                        return;
                                    }
                                    roster = [];
                                    history = {};
                                    buildHistoryIndex();
                                    updateHolidayMap();
                                    populateWeekDropdown();
                                    buildWeeklyGrid();
                                }).catch(() => {
                                    roster = [];
                                    history = {};
                                    buildHistoryIndex();
                                    updateHolidayMap();
                                    populateWeekDropdown();
                                    buildWeeklyGrid();
                                });
                                return;
                            }
                            console.warn("Class document does not exist in Firestore:", classId);
                            roster = [];
                            history = {};
                            buildHistoryIndex();
                            updateHolidayMap();
                            populateWeekDropdown();
                            buildWeeklyGrid();
                        }
                    }, err => {
                        console.error("Firestore snapshot error on class:", err);
                    });
                }
            }

            // Helper to get logged-in user (synchronous from cache or fallback)
            function getAuthUser() {
                try {
                    if (typeof authManager !== 'undefined' && authManager.user) {
                        return authManager.user;
                    }
                    const raw = localStorage.getItem('authUser');
                    if (raw) return JSON.parse(raw);
                } catch (e) {}
                return null;
            }

            // Async helper to ensure user metadata (role, year, section) is fully loaded from Firestore if needed
            async function getAuthUserAsync() {
                let u = getAuthUser();
                if (typeof auth !== 'undefined' && auth.currentUser && typeof db !== 'undefined') {
                    if (!u || !u.role || (u.role === 'student' && (!u.year || !u.section))) {
                        try {
                            const userDoc = await db.collection('users').doc(auth.currentUser.uid).get();
                            if (userDoc.exists) {
                                const d = userDoc.data();
                                u = Object.assign({}, u || {}, d, { uid: auth.currentUser.uid, email: auth.currentUser.email });
                                localStorage.setItem('authUser', JSON.stringify(u));
                                if (typeof authManager !== 'undefined') authManager.user = u;
                            }
                        } catch (err) {
                            console.warn("Could not fetch user metadata from Firestore:", err);
                        }
                    }
                }
                return u;
            }

            async function loadClasses() {
                try {
                    if (typeof db !== 'undefined') {
                        try {
                            const holSnap = await db.collection('holidays').get();
                            globalHolidays = [];
                            holSnap.forEach(d => {
                                const h = d.data();
                                globalHolidays.push(h.date ? h : { date: d.id, ...h });
                            });
                            updateHolidayMap();
                        } catch (e) {
                            console.warn("Could not load holidays:", e);
                        }

                        // Ensure auth user profile is resolved
                        const currentUser = await getAuthUserAsync();
                        const isStudentUser = currentUser && (currentUser.role === 'student' || currentUser.role === 'Student');

                        const classesSnap = await db.collection('classes').get();
                        classSelect.innerHTML = '';
                        
                        if (classesSnap.empty) {
                            classSelect.innerHTML = '<option value="">No classes available</option>';
                            buildWeeklyGrid();
                            return;
                        }

                        const rawDocs = [];
                        classesSnap.forEach(doc => rawDocs.push({ id: doc.id, data: doc.data() }));

                        let docs = rawDocs;
                        if (docs.length === 0) {
                            classSelect.innerHTML = '<option value="">No class assigned</option>';
                            buildWeeklyGrid();
                            return;
                        }

                        docs.sort((a, b) => {
                            const nameA = `${a.data.year || ''} ${a.data.section || ''}`;
                            const nameB = `${b.data.year || ''} ${b.data.section || ''}`;
                            return nameA.localeCompare(nameB);
                        });

                        const availableIds = [];
                        docs.forEach(({ id, data }) => {
                            availableIds.push(id);
                            const opt = document.createElement('option');
                            opt.value = id;
                            const yr = data.year || '';
                            const br = data.branch || 'CSE';
                            const dp = data.department || 'DS';
                            const sc = data.section || '';
                            opt.textContent = `${yr} ${br} ${dp} ${sc}`.trim() || id;
                            classSelect.appendChild(opt);
                        });

                        // Ensure dropdown is always enabled and unlocked
                        classSelect.disabled = false;
                        classSelect.style.cursor = 'pointer';
                        classSelect.style.opacity = '1';
                        classSelect.removeAttribute('title');

                        let resolvedClassId = null;
                        if (currentClassId) {
                            if (availableIds.includes(currentClassId)) {
                                resolvedClassId = currentClassId;
                            } else {
                                const matched = availableIds.find(id => resolveClassId(id) === resolveClassId(currentClassId));
                                if (matched) resolvedClassId = matched;
                            }
                        }

                        // Default to student's enrolled class if available, or IV_D
                        if (!resolvedClassId && isStudentUser) {
                            const sYear = String(currentUser.year || '').trim().toUpperCase();
                            const sSec = String(currentUser.section || '').trim().toUpperCase();
                            const sCandidate = availableIds.find(id => id.includes(sYear) && id.includes(sSec));
                            if (sCandidate) resolvedClassId = sCandidate;
                        }

                        if (!resolvedClassId) {
                            if (availableIds.includes('IV_D')) {
                                resolvedClassId = 'IV_D';
                            } else if (availableIds.length > 0) {
                                resolvedClassId = availableIds[0];
                            }
                        }

                        currentClassId = resolvedClassId || availableIds[0];
                        classSelect.value = currentClassId;
                        localStorage.setItem('current_class_id', currentClassId);

                        subscribeToClass(currentClassId);
                    }
                } catch (err) {
                    console.error("Error loading classes from Firestore:", err);
                }
            }

            classSelect.addEventListener('change', () => {
                currentClassId = classSelect.value;
                localStorage.setItem('current_class_id', currentClassId);
                subscribeToClass(currentClassId);
            });

            // Week Selector Event Listeners
            weekSelect.addEventListener('change', () => {
                if (showAllToggle) showAllToggle.checked = false;
                picker.value = weekSelect.value;
                buildWeeklyGrid();
            });

            picker.addEventListener('change', () => {
                if (showAllToggle) showAllToggle.checked = false;
                const monKey = getMondayKey(picker.value);
                if (weekSelect.querySelector(`option[value="${monKey}"]`)) {
                    weekSelect.value = monKey;
                }
                buildWeeklyGrid();
            });

            prevWeekBtn.addEventListener('click', () => {
                if (showAllToggle) showAllToggle.checked = false;
                const idx = weekSelect.selectedIndex;
                if (idx < weekSelect.options.length - 1) {
                    weekSelect.selectedIndex = idx + 1; // Dropdown is descending (newest first)
                    picker.value = weekSelect.value;
                    buildWeeklyGrid();
                }
            });

            nextWeekBtn.addEventListener('click', () => {
                if (showAllToggle) showAllToggle.checked = false;
                const idx = weekSelect.selectedIndex;
                if (idx > 0) {
                    weekSelect.selectedIndex = idx - 1; // Dropdown is descending (newest first)
                    picker.value = weekSelect.value;
                    buildWeeklyGrid();
                }
            });

            showAllToggle.addEventListener('change', buildWeeklyGrid);

            document.getElementById('export-excel-btn').addEventListener('click', () => {
                const tables = document.querySelectorAll('#reports-container table');
                if (tables.length === 0) {
                    alert("No report data available to export!");
                    return;
                }
                
                const wb = XLSX.utils.book_new();
                tables.forEach((table, index) => {
                    const ws = XLSX.utils.table_to_sheet(table);
                    const titleBadge = table.closest('.report-wrapper') ? table.closest('.report-wrapper').querySelector('.section-badge') : null;
                    let sheetName = `Week ${index + 1}`;
                    if (titleBadge && titleBadge.textContent) {
                        const m = titleBadge.textContent.match(/WEEK\s*(\d+)/i);
                        if (m) sheetName = `Week ${m[1]}`;
                    }
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });
                
                const secDetails = getSectionDetails();
                XLSX.writeFile(wb, `Weekly_Attendance_Report_Section_${secDetails.formattedCode}.xlsx`);
            });

            document.getElementById('export-pdf-btn').addEventListener('click', () => {
                const element = document.getElementById('reports-container');
                if (!element || element.innerHTML.trim() === '') return;

                const opt = {
                    margin:       0.5,
                    filename:     'Weekly_Attendance_Report.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' },
                    pagebreak:    { mode: 'css' }
                };
                
                html2pdf().set(opt).from(element).save();
            });

            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                const printBtn = document.getElementById('print-btn');
                if (printBtn) printBtn.style.display = 'none';
                
                const pdfBtn = document.getElementById('export-pdf-btn');
                if (pdfBtn) pdfBtn.style.display = 'inline-flex';
            }

            auth.onAuthStateChanged(user => {
                loadClasses();
            });
        });
    </script>
</body>
</html>
