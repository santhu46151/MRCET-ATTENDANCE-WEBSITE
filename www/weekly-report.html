<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Attendance Report - Section IV-D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS library to export genuine Excel files -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- App Configuration and Auth -->
    <script src="auth.js"></script>
    <style>
        /* Specific Styles for Excel Weekly Report */
        .report-wrapper {
            background-color: white;
            color: #000;
            padding: 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid #ccc;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }

        .dark-mode .report-wrapper {
            background-color: #ffffff; /* Keep report white like paper even in dark mode for printable layout */
            color: #000000;
            border-color: #bbbbbb;
        }

        /* College Header Styling */
        .college-header {
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            align-items: center;
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .college-logo-svg {
            width: 90px;
            height: 90px;
        }

        .college-info h2 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: #4b0082; /* Indigo/Purple color */
            margin-bottom: 0.15rem;
        }

        .college-info h3 {
            font-size: 0.95rem;
            color: red;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .college-info p {
            font-size: 0.8rem;
            color: #333;
            font-weight: 600;
            line-height: 1.3;
        }

        .report-subtitle {
            text-align: center;
            font-weight: 800;
            border-bottom: 1.5px solid #000;
            padding: 0.35rem 0;
            font-size: 0.95rem;
        }

        .section-badge {
            text-align: center;
            font-weight: 800;
            font-size: 0.9rem;
            background-color: #e2e8f0;
            padding: 0.3rem;
            border: 1px solid #000;
            margin: 0.5rem 0 1rem 0;
        }

        /* Excel grid table formatting */
        .excel-grid-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
        }

        .excel-grid-table th, 
        .excel-grid-table td {
            border: 1px solid #000;
            padding: 4px 6px;
            vertical-align: middle;
        }

        .excel-grid-table th {
            background-color: #f2f2f2;
            font-weight: 700;
            text-align: center;
        }

        .excel-grid-table td {
            text-align: center;
            font-weight: 500;
        }

        .excel-grid-table td.student-name-cell {
            text-align: left;
            padding-left: 8px;
            font-weight: 600;
            white-space: nowrap;
        }

        .excel-grid-table td.absent-cell {
            color: red;
            font-weight: 700;
            background-color: #fee2e2;
        }

        .excel-grid-table tr.totals-row td {
            font-weight: 700;
            background-color: #f2f2f2;
        }

        .excel-grid-table tr:hover {
            background-color: rgba(79, 70, 229, 0.05);
        }

        /* Controls Panel */
        .controls-panel {
            max-width: 1250px;
            margin: 0 auto 1.5rem auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        @media print {
            body {
                background: white !important;
                padding: 0;
                margin: 0;
            }
            .controls-panel, nav, footer, .bg-glow, .bg-glow-2 {
                display: none !important;
            }
            .report-wrapper {
                page-break-after: always;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 0 2cm 0 !important;
                max-width: 100% !important;
            }
            .report-wrapper:last-of-type {
                page-break-after: avoid !important;
                margin-bottom: 0 !important;
            }
            .excel-grid-table {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container" style="max-width: 1300px; padding-top: 1rem;">
        <!-- Breadcrumb Nav -->
        <nav aria-label="Breadcrumb">
            <a href="index.html" class="back-nav" style="text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                <i class="fas fa-arrow-left"></i> Back to Attendance Dashboard
            </a>
        </nav>

        <!-- Controls panel -->
        <section class="controls-panel glass-panel">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <label for="week-picker" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary);">Select Week Date:</label>
                    <input type="date" id="week-picker" style="border: 1px solid var(--card-border); background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); outline: none; cursor: pointer;">
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="show-all-weeks-toggle" checked style="cursor: pointer; width: 1.1rem; height: 1.1rem; accent-color: var(--primary);">
                    <label for="show-all-weeks-toggle" style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer;">Show all logged weeks</label>
                </div>
            </div>
            <div style="display: flex; gap: 0.75rem;">
                <button class="btn btn-outline" id="export-excel-btn" style="color: #107c41; border-color: #107c41;">
                    <i class="fas fa-file-excel"></i> Export to Excel (.xlsx)
                </button>
                <button class="btn btn-primary" onclick="window.print()">
                    <i class="fas fa-print"></i> Print All Sheets
                </button>
            </div>
        </section>

        <!-- Dynamic Reports Container -->
        <div id="reports-container"></div>

        <footer style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem;">
            <p>&copy; 2026 Class Weekly Attendance System. Printable Sheet Mode.</p>
        </footer>
    </div>

    <!-- Script to calculate and draw grid -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Dark theme detection (applies to page background but keeps printable report page white)
            const isDarkMode = localStorage.getItem('theme') === 'dark';
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            }

            // Week picker initialization
            const picker = document.getElementById('week-picker');

            // Parse selected date from query params or fallback to today
            const urlParams = new URLSearchParams(window.location.search);
            const dateQuery = urlParams.get('date');
            
            let selectedDateObj = dateQuery ? new Date(dateQuery) : new Date();
            if (isNaN(selectedDateObj.getTime())) {
                selectedDateObj = new Date();
            }

            // Set picker value in YYYY-MM-DD
            const yyyy = selectedDateObj.getFullYear();
            const mm = String(selectedDateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(selectedDateObj.getDate()).padStart(2, '0');
            picker.value = `${yyyy}-${mm}-${dd}`;

            // Load Data from LocalStorage (synced by auth/sync manager API)
            let roster = JSON.parse(localStorage.getItem('attendance_roster')) || [];
            let history = JSON.parse(localStorage.getItem('attendance_history')) || {};
            const showAllToggle = document.getElementById('show-all-weeks-toggle');

            // Set up local polling update listener to reflect edits dynamically
            setInterval(() => {
                roster = JSON.parse(localStorage.getItem('attendance_roster')) || [];
                history = JSON.parse(localStorage.getItem('attendance_history')) || {};
                buildWeeklyGrid();
            }, 3000);

            // Helper to get Monday Date
            function getMondayDate(dObj) {
                const day = dObj.getDay();
                const diff = dObj.getDate() - day + (day === 0 ? -6 : 1);
                return new Date(dObj.setDate(diff));
            }

            // Helper to format Date to YYYY-MM-DD
            function getFormattedKey(dObj) {
                const y = dObj.getFullYear();
                const m = String(dObj.getMonth() + 1).padStart(2, '0');
                const d = String(dObj.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function getMondayKey(dateStr) {
                const parts = dateStr.split('-');
                const dObj = new Date(parts[0], parts[1]-1, parts[2]);
                const mon = getMondayDate(dObj);
                return getFormattedKey(mon);
            }

            function buildWeeklyGrid() {
                const reportsContainer = document.getElementById('reports-container');
                reportsContainer.innerHTML = '';

                // Get Monday keys
                let mondayKeys = [];
                if (showAllToggle.checked) {
                    const loggedDates = Object.keys(history);
                    const keysSet = new Set();
                    loggedDates.forEach(dateStr => {
                        keysSet.add(getMondayKey(dateStr));
                    });
                    mondayKeys = Array.from(keysSet).sort();
                }

                // If no keys found or toggle is off, use the selected date picker week
                if (mondayKeys.length === 0 || !showAllToggle.checked) {
                    mondayKeys = [getMondayKey(picker.value)];
                }

                // For each week, generate a table wrapper
                mondayKeys.forEach(mondayKey => {
                    const parts = mondayKey.split('-');
                    const monday = new Date(parts[0], parts[1]-1, parts[2]);

                    // Generate dates for Monday to Saturday
                    const weekDates = [];
                    for (let i = 0; i < 6; i++) {
                        const nextDate = new Date(monday);
                        nextDate.setDate(monday.getDate() + i);
                        const key = getFormattedKey(nextDate);
                        const label = `${String(nextDate.getDate()).padStart(2, '0')}-${String(nextDate.getMonth() + 1).padStart(2, '0')}-${nextDate.getFullYear()}`;
                        
                        weekDates.push({
                            key: key,
                            label: label
                        });
                    }

                    // Calculate total active school days
                    let schoolDaysCount = 0;
                    weekDates.forEach(col => {
                        const record = history[col.key] || {};
                        if (!record.isHoliday) {
                            schoolDaysCount++;
                        }
                    });

                    // Build wrapper HTML
                    const wrapper = document.createElement('main');
                    wrapper.className = 'report-wrapper';

                    // Dynamic Date Header Row columns HTML
                    let dateHeadersHTML = '';
                    weekDates.forEach(col => {
                        dateHeadersHTML += `<th style="width: 85px;">${col.label}</th>`;
                    });

                    // Build student rows
                    const presenteesPerDay = Array(weekDates.length).fill(0);
                    let tbodyHTML = '';

                    roster.sort((a,b) => a.rollNo.localeCompare(b.rollNo)).forEach((student, index) => {
                        let rowHTML = `
                            <tr>
                                <td style="background-color: #f2f2f2; font-weight: 700; text-align: center;">${index + 1}</td>
                                <td style="font-weight: 700; text-align: center;">${student.rollNo}</td>
                                <td class="student-name-cell">${student.name}</td>
                        `;

                        let presentCount = 0;
                        weekDates.forEach((col, colIdx) => {
                            const record = history[col.key];
                            if (record && record.isHoliday) {
                                if (index === 0) {
                                    const reason = record.holidayReason || "Holiday";
                                    const stackedReason = reason.substring(0, 10).toUpperCase().split('').join('<br>');
                                    rowHTML += `<td rowspan="${roster.length}" style="background-color: #fef08a; color: #4f46e5; font-weight: 700; text-align: center; font-size: 0.65rem; line-height: 1.2; padding: 2px 0; word-break: break-all; vertical-align: middle;" title="${reason}">${stackedReason}</td>`;
                                }
                            } else {
                                const attendance = (record && record.attendance) || {};
                                const status = attendance[student.rollNo] || "present";
                                if (status === "present") {
                                    presentCount++;
                                    presenteesPerDay[colIdx]++;
                                    rowHTML += `<td style="text-align: center;">${presentCount}</td>`;
                                } else {
                                    rowHTML += `<td class="absent-cell">AB</td>`;
                                }
                            }
                        });

                        const percentage = schoolDaysCount > 0 
                            ? ((presentCount / schoolDaysCount) * 100).toFixed(2)
                            : "0.00";

                        rowHTML += `
                            <td style="font-weight: 700; background-color: #f2f2f2; text-align: center;">${presentCount}</td>
                            <td style="font-weight: 700; background-color: #f2f2f2; text-align: center;">${percentage}</td>
                            </tr>
                        `;
                        tbodyHTML += rowHTML;
                    });

                    // Totals row
                    let totalsHTML = `
                        <tr class="totals-row">
                            <td colspan="3" style="text-align: right; padding-right: 12px; font-weight: 800;">TOTAL PRESENTEE PER DAY</td>
                    `;
                    weekDates.forEach((col, colIdx) => {
                        const record = history[col.key];
                        if (record && record.isHoliday) {
                            const shortReason = (record.holidayReason || "HOL").substring(0, 3).toUpperCase();
                            totalsHTML += `<td style="font-weight: 700; background-color: #fef08a; color: #4f46e5; text-align: center; font-size: 0.6rem;" title="${record.holidayReason || 'Holiday'}">${shortReason}</td>`;
                        } else {
                            totalsHTML += `<td style="text-align: center;">${presenteesPerDay[colIdx]}</td>`;
                        }
                    });
                    totalsHTML += `<td colspan="2" style="background-color:#e2e8f0;"></td></tr>`;

                    // Assemble the full report wrapper
                    wrapper.innerHTML = `
                        <!-- College Header Info (Image) -->
                        <div style="width: 100%; border-bottom: 2px solid #000; padding-bottom: 0.5rem; margin-bottom: 1rem; text-align: center;">

            }

            // Excel Export Button Handler
            const exportExcelBtn = document.getElementById('export-excel-btn');
            exportExcelBtn.addEventListener('click', () => {
                const tables = document.querySelectorAll('#reports-container table');
                if (tables.length === 0) {
                    alert("No report data available to export!");
                    return;
                }
                
                const wb = XLSX.utils.book_new();
                tables.forEach((table, index) => {
                    // Export each weekly sheet
                    const ws = XLSX.utils.table_to_sheet(table);
                    XLSX.utils.book_append_sheet(wb, ws, `Week ${index + 1}`);
                });
                
                XLSX.writeFile(wb, 'Weekly_Attendance_Report_Section_IV-D.xlsx');
            });

            // Build grid on load and picker change
            buildWeeklyGrid();
            picker.addEventListener('change', buildWeeklyGrid);
            showAllToggle.addEventListener('change', buildWeeklyGrid);
        });
